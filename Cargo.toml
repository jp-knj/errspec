[package]
name = "errspec"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "MIT"
repository = "https://github.com/jp-knj/errspec"
description = "Link TypeScript error variants to explicit failure contracts and test evidence"

[[bin]]
name = "errspec"
path = "src/bin/errspec/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
roxmltree = "0.21.2"
sha2 = "0.10"
libc = "0.2"
signal-hook = "0.3"
tsrs_parser = { git = "https://github.com/oxc-project/tsrs", rev = "1bfd1e65be95131f9242a03687d37006214a96f6" }
tsrs_ast = { git = "https://github.com/oxc-project/tsrs", rev = "1bfd1e65be95131f9242a03687d37006214a96f6" }
tsrs_scanner = { git = "https://github.com/oxc-project/tsrs", rev = "1bfd1e65be95131f9242a03687d37006214a96f6" }
tsrs_checker = { git = "https://github.com/oxc-project/tsrs", rev = "1bfd1e65be95131f9242a03687d37006214a96f6" }
tsrs_compiler = { git = "https://github.com/oxc-project/tsrs", rev = "1bfd1e65be95131f9242a03687d37006214a96f6" }
tsrs_core = { git = "https://github.com/oxc-project/tsrs", rev = "1bfd1e65be95131f9242a03687d37006214a96f6" }
tsrs_tsoptions = { git = "https://github.com/oxc-project/tsrs", rev = "1bfd1e65be95131f9242a03687d37006214a96f6" }
tsrs_vfs = { git = "https://github.com/oxc-project/tsrs", rev = "1bfd1e65be95131f9242a03687d37006214a96f6" }

[dev-dependencies]
insta = { version = "1.49.0", features = ["json"] }

[build-dependencies]
sha2 = "0.10"

[profile.dev]
debug = false

[profile.release]
# Rust 1.99.1 thin LTO produced unresolved std/anonymous symbols in the release link.
# Keep normal release optimization; verify the packed binary on each build host.
lto = false
strip = true
