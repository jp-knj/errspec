name: Check
on: [push, pull_request]
env:
  INSTA_UPDATE: "no"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy,rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            examples/checkout/package-lock.json
            packages/mutation-driver/package-lock.json
            packages/analysis-driver/package-lock.json
            packages/report-tests/package-lock.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: packages/mutation-driver
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: packages/analysis-driver
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: packages/report-tests
      - run: node scripts/build-mutation-driver.mjs --check
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: examples/checkout
      - run: node scripts/demo.mjs
      - run: node scripts/demo-bun.mjs
      - run: node --test tests/testkit.test.mjs
      - run: node --test tests/testkit.test.mjs
        env:
          TESTKIT_ENTRY: ../packages/testkit/index.ts
      - run: node --test tests/package.test.mjs
      - run: node --test tests/vitest-recorder.test.mjs
      - run: node --test tests/analysis-driver.test.mjs
      - run: node --test --test-concurrency=1 tests/mutation-reports.test.mjs tests/mutation-child-process.test.mjs tests/action.test.mjs tests/skills.test.mjs
      - run: node --test tests/mutator-comparison.test.mjs
      - run: node --test tests/mutation-emitter.test.mjs
      - run: node --test --test-concurrency=1 tests/mutation-plugins.test.mjs
      - run: node --test --test-concurrency=1 tests/mutation-matrix-selection.test.mjs
      - run: node --test tests/practical-mutation.test.mjs
      - run: node --test tests/mutation-process.test.mjs
      - run: node --test tests/mutation-ownership.test.mjs
      - run: node --test --test-concurrency=1 tests/mutation-parallel.test.mjs
      - run: node --test --test-concurrency=1 tests/mutation-cache-relocation.test.mjs
      - run: node --test --test-concurrency=1 tests/mutation-scope-cache.test.mjs
      - run: node --test --test-concurrency=1 tests/mutation-callgraph.test.mjs
      - run: node --test tests/mutation-process.test.mjs
        env:
          ERRSPEC_REUSE_SESSION: "1"
      - run: node --test --test-concurrency=1 tests/mutation-typecheck.test.mjs tests/mutation-weak.test.mjs tests/mutation-workflows.test.mjs tests/mutation-options.test.mjs tests/mutation-selection.test.mjs tests/mutation-baseline.test.mjs tests/mutation-session.test.mjs tests/mutation-cache.test.mjs tests/mutation-shards.test.mjs
      - run: node --test --test-concurrency=1 tests/mutation-typecheck.test.mjs tests/mutation-weak.test.mjs
        env:
          ERRSPEC_REUSE_SESSION: "1"
      - run: node scripts/demo-mutation.mjs
      - run: node scripts/demo-mutation.mjs
        env:
          ERRSPEC_REUSE_SESSION: "1"
      - run: node --test tests/failure-atomicity.test.mjs
      - run: node --test tests/failure-atomicity.test.mjs
        env:
          TESTKIT_ENTRY: ../packages/testkit/index.ts
      - run: node scripts/demo-scenarios.mjs
      - run: node scripts/demo-init.mjs
      - run: node scripts/demo-module-mock.mjs
      - run: node scripts/demo-failure-boundaries.mjs
      - run: node scripts/demo-failure-paths.mjs
      - run: node scripts/demo-coverage.mjs
      - uses: actions/checkout@v4
        with:
          repository: open-circle/valibot
          ref: d72f76fcf70ccfa0a5ca341b80da1d440ac60b11
          path: .valibot-source
          persist-credentials: false
      - run: node scripts/pilot-valibot.mjs .valibot-source
      - uses: actions/upload-artifact@v4
        with:
          name: valibot-pilot
          path: artifacts/valibot-pilot.json
          if-no-files-found: error
  runners:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/fixtures/runners/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: tests/fixtures/runners
      - run: node node_modules/@playwright/test/cli.js install --with-deps chromium
        working-directory: tests/fixtures/runners
      - run: cargo build --locked
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: packages/analysis-driver
      - run: node --test --test-concurrency=1 tests/mutation-runners.test.mjs tests/mutation-runner-matrix.test.mjs tests/mutation-runner-child-process.test.mjs tests/runner-packages.test.mjs
